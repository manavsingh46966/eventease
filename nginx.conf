events {}

http {
  # Per-IP limit at the load balancer too (defence in depth)
  limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;

  upstream backend {
    # round-robin by default; failed servers are skipped automatically
    server app1:8000 max_fails=2 fail_timeout=10s;
    server app2:8000 max_fails=2 fail_timeout=10s;
  }

  server {
    listen 80;
    server_tokens off;

    location / {
      limit_req zone=perip burst=40 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
