# Local load-balancing demo: Nginx -> 2 FastAPI containers -> shared Postgres
# Run:  ADMIN_KEY=secret docker compose up --build   then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventease
      POSTGRES_PASSWORD: eventease
      POSTGRES_DB: eventease
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventease"]
      interval: 3s
      retries: 10

  app1: &app
    build: .
    environment:
      DATABASE_URL: postgresql://eventease:eventease@db:5432/eventease
      ADMIN_KEY: ${ADMIN_KEY:-demo-admin-key}
      PORT: "8000"
    depends_on:
      db: { condition: service_healthy }
  app2:
    <<: *app

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [app1, app2]
